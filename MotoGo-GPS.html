<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820"><title>MotoGo GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#101820;--panel:#17232e;--accent:#b7f34a;--text:#f6f8fa;--muted:#a8b4bf;--line:#30404c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);z-index:500}.brand{font-weight:900;font-size:22px;letter-spacing:-.7px}.brand span{color:var(--accent)}.tag{font-size:11px;color:var(--muted);margin-top:2px}.mode{display:flex;gap:6px}.mode button,.chip,.btn{border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:var(--panel);color:var(--text);font-weight:700}.mode button.active{background:var(--accent);color:#17200d;border-color:var(--accent)}.search{padding:0 14px 12px;display:flex;gap:8px;z-index:500;background:var(--bg)}input{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:#f8fafc;color:#14202a;font-size:16px;outline:none}.btn.primary{background:var(--accent);color:#14200c;border-color:var(--accent)}#map{height:52dvh;min-height:330px;z-index:1;background:#dfe7df}.bottom{padding:12px 14px 22px;display:grid;gap:10px}.routebox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hint{font-size:13px;color:var(--muted);line-height:1.4}.big{font-size:18px;font-weight:800}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{min-height:52px}.status{font-size:12px;color:var(--muted);text-align:center;padding:0 12px 8px}.resultlist{position:absolute;left:14px;right:14px;top:120px;z-index:1000;background:white;color:#17232e;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px #0004;max-height:40vh;overflow-y:auto}.result{padding:13px;border-bottom:1px solid #e4e8eb;text-align:left;width:100%;background:white;color:#17232e;border:0;font-size:14px}.hidden{display:none}.leaflet-control-attribution{font-size:9px!important}@media(min-width:700px){#map{height:58vh}.bottom{grid-template-columns:1fr 1fr;align-items:start}.actions{grid-column:1/-1}.status{grid-column:1/-1}}
</style></head>
<body><main class="app">
<header class="top"><div><div class="brand">Moto<span>Go</span> GPS</div><div class="tag">Tu camino, más simple.</div></div><div class="mode"><button id="moto" class="active" onclick="setMode('moto')">🏍️ Moto</button><button id="auto" onclick="setMode('auto')">🚗 Auto</button></div></header>
<section class="search"><input id="destination" placeholder="¿A dónde vamos? Escribí una dirección" autocomplete="off"><button class="btn primary" onclick="searchPlace()">Buscar</button></section>
<div id="results" class="resultlist hidden"></div><div id="map" aria-label="Mapa de navegación"></div>
<section class="bottom"><div class="routebox"><div><div class="hint" id="routeTitle">Listo para salir</div><div class="big" id="routeDistance">Buscá un destino</div></div><button class="btn primary" onclick="startNavigation()">▶ Iniciar</button></div><div class="routebox"><div><div class="hint">Tu ubicación</div><div class="big" id="locationText">Todavía no localizada</div></div><button class="btn" onclick="locateMe()">◎ GPS</button></div><div class="actions"><button class="chip" onclick="report('⚠️','Peligro en la vía')">⚠️ Peligro</button><button class="chip" onclick="report('🕳️','Pozo')">🕳️ Pozo</button><button class="chip" onclick="report('🚧','Obra / corte')">🚧 Obra</button></div><div class="status" id="status">Activá el GPS para centrar el mapa. La ubicación funciona en un sitio HTTPS.</div></section>
</main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([-34.800,-58.386],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let me=null,dest=null,routeLayer=null,mode='moto',watch=null,navigating=false,alerts=[];const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;
function setMode(m){mode=m;$('moto').classList.toggle('active',m==='moto');$('auto').classList.toggle('active',m==='auto');status('Modo '+(m==='moto'?'moto':'auto')+' seleccionado.');}
function locateMe(){if(!navigator.geolocation){status('Este navegador no permite GPS.');return}status('Buscando tu ubicación…');navigator.geolocation.getCurrentPosition(p=>{updateMe(p.coords.latitude,p.coords.longitude);map.setView([p.coords.latitude,p.coords.longitude],16);status('GPS activado. Tu ubicación se muestra en el mapa.');if(watch===null)watch=navigator.geolocation.watchPosition(q=>updateMe(q.coords.latitude,q.coords.longitude),()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000});},e=>{status(e.code===1?'Permití la ubicación en Ajustes del iPhone y volvé a intentar.':'No pudimos encontrar el GPS. Revisá la señal y los permisos.');},{enableHighAccuracy:true,timeout:15000});}
function updateMe(lat,lon){me=[lat,lon];if(!window.meMarker){window.meMarker=L.circleMarker(me,{radius:9,color:'#fff',weight:3,fillColor:'#2279ff',fillOpacity:1}).addTo(map).bindPopup('Estás acá');}else window.meMarker.setLatLng(me);$('locationText').textContent=lat.toFixed(4)+', '+lon.toFixed(4);}
async function searchPlace(){const q=$('destination').value.trim();if(!q){status('Escribí una dirección o lugar primero.');return}status('Buscando destino…');try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(q));if(!r.ok)throw Error();const data=await r.json();const box=$('results');box.innerHTML='';if(!data.length){status('No encontramos ese lugar. Probá con calle, localidad y provincia.');return}data.forEach(p=>{const b=document.createElement('button');b.className='result';b.textContent=p.display_name;b.onclick=()=>chooseDest(p);box.appendChild(b)});box.classList.remove('hidden');status('Elegí el destino correcto de la lista.');}catch(e){status('No pudimos buscar ahora. Revisá tu conexión e intentá de nuevo.')}}
function chooseDest(p){$('results').classList.add('hidden');dest=[+p.lat,+p.lon];if(window.destMarker)map.removeLayer(window.destMarker);window.destMarker=L.marker(dest).addTo(map).bindPopup('Destino').openPopup();map.setView(dest,14);$('routeTitle').textContent=p.display_name.split(',').slice(0,2).join(',');$('routeDistance').textContent='Calculando ruta…';if(me)calcRoute();else status('Destino elegido. Tocá GPS para calcular desde tu ubicación.');}
async function calcRoute(){if(!me||!dest){status('Activá el GPS y elegí un destino.');return}status('Calculando ruta…');try{const url=`https://router.project-osrm.org/route/v1/driving/${me[1]},${me[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&steps=true`;const r=await fetch(url);if(!r.ok)throw Error();const d=await r.json();if(d.code!=='Ok'||!d.routes.length)throw Error();const rt=d.routes[0];if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(rt.geometry,{style:{color:'#2679ff',weight:6,opacity:.9}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[25,25]});$('routeDistance').textContent=(rt.distance/1000).toFixed(1)+' km · '+Math.round(rt.duration/60)+' min aprox.';status('Ruta estimada. Respetá las señales y manejá con atención.');window.routeSteps=rt.legs[0].steps||[];}catch(e){$('routeDistance').textContent='No se pudo calcular';status('El servicio de rutas no respondió. Probá de nuevo más tarde.');}}
function startNavigation(){if(!dest){status('Primero buscá y elegí un destino.');return}if(!me){locateMe();status('Activá el GPS; después tocá Iniciar de nuevo.');return}if(!routeLayer){calcRoute();return}navigating=true;status('Navegación iniciada. Mantené el iPhone seguro y no lo uses mientras manejás.');if(window.routeSteps&&window.routeSteps.length){const s=window.routeSteps[0];if(s.maneuver&&s.maneuver.instruction){$('routeTitle').textContent=s.maneuver.instruction;if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(s.maneuver.instruction));}}}}
function report(emoji,label){if(!me){status('Activá el GPS antes de reportar un punto.');return}const m=L.marker(me).addTo(map).bindPopup(emoji+' '+label+'<br>Reporte de prueba en este dispositivo');alerts.push({at:me,label});m.openPopup();status(label+' marcado en este mapa de prueba. El reporte no se comparte con otros usuarios.');}
$('destination').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});map.on('click',e=>{});
</script></body></html>
